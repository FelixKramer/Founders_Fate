# pre-commit hooks
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^services/mirofish/  # upstream may have invalid YAML; gate later
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=2048']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^services/mirofish/.*\.py$
        args: [--fix]
      - id: ruff-format
        files: ^services/mirofish/.*\.py$

  - repo: local
    hooks:
      - id: app-eslint
        name: app eslint
        language: system
        files: ^app/.*\.(ts|tsx|js|jsx|mjs)$
        entry: bash -c 'cd app && bunx eslint --max-warnings=0'
        pass_filenames: false
        stages: [pre-commit]

      - id: app-prettier
        name: app prettier
        language: system
        files: ^app/.*\.(ts|tsx|js|jsx|mjs|json|md|css)$
        entry: bash -c 'cd app && bunx prettier --check .'
        pass_filenames: false
        stages: [pre-commit]

      - id: mirofish-direct-llm-import-guard
        name: forbid direct LLM SDK imports outside gateway
        language: system
        files: ^services/mirofish/backend/.*\.py$
        exclude: ^services/mirofish/backend/llm_gateway/
        entry: bash -c '! grep -rEn "^(import|from) (openai|anthropic|google\.generativeai)" "$@"' --
        stages: [pre-commit]
