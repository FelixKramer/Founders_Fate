# ============================================
# PostgREST Configuration
# ============================================
# This is the config file for PostgREST server
# Docs: https://postgrest.org/en/stable/configuration.html

# Database connection
db-uri = "postgres://authenticator:your_authenticator_password@localhost:5432/launchpad"
db-schema = "public"
db-anon-role = "anon"

# Server
server-host = "0.0.0.0"
server-port = 3001

# JWT Secret (must match NEXTAUTH_SECRET in .env)
jwt-secret = "your-super-secret-jwt-key-change-this"

# OpenAPI mode
openapi-mode = "follow-privileges"

# Row Level Security
db-use-legacy-gucs = false

# Maximum rows returned per request
db-max-rows = 1000

# Request timeout
db-tx-end = "commit"

# Pre-request function (runs before every request)
# Can be used for additional auth/validation logic
# db-pre-request = "public.pre_request"
