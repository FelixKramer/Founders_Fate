name: mirofish

on:
  push:
    paths:
      - 'services/mirofish/**'
      - '.github/workflows/mirofish.yml'
  pull_request:
    paths:
      - 'services/mirofish/**'
      - '.github/workflows/mirofish.yml'

defaults:
  run:
    working-directory: services/mirofish

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Sync deps
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app
        continue-on-error: true  # Tighten once we've cleaned upstream types.

      - name: Pytest
        env:
          LLM_GATEWAY_MODE: mock
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q
        continue-on-error: true  # Until our test suite exists.

  llm-gateway-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid direct LLM SDK imports outside gateway
        run: |
          set -e
          violations=$(grep -rEn "^(import|from) (openai|anthropic|google\\.generativeai)" services/mirofish/backend \
            --exclude-dir=__pycache__ \
            --exclude-dir=llm_gateway \
            --exclude-dir=.venv \
            --include="*.py" || true)
          if [ -n "$violations" ]; then
            echo "::error::Direct LLM SDK imports are only allowed inside services/mirofish/backend/llm_gateway/"
            echo "$violations"
            exit 1
          fi
